name: Cancelar despliegue atascado

on: workflow_dispatch

permissions:
  pages: write
  contents: read

jobs:
  cancelar:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X POST repos/${{ github.repository }}/pages/deployments/1816350d9ef917f39bce2c6dfac5d7a79deab53f/cancel
        env:
          GH_TOKEN: ${{ github.token }}
